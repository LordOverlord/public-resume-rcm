name: Build and Publish Resume

on:
  # Validate every PR so the build check can be required by branch protection.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.cls'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.ttf'
      - '**.otf'
      - '.github/workflows/build-resume.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile resume with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          # latex-action v3 maps 2025 to the moving 'latest' image.
          # TeX Live 2024 resolves to a fixed 2025-03-01 container tag.
          texlive_version: '2024'

      - name: Validate PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s resume.pdf
          file resume.pdf | grep -q 'PDF document'
          sha256sum resume.pdf

      # Preserve the PDF even if the later publication job fails.
      - name: Upload validated PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish versioned release
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Running publications are never cancelled; newer pending jobs may replace
    # older ones. The HEAD check prevents publishing an outdated build.
    concurrency:
      group: resume-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out source and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated PDF
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Publish immutable version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_ASSET: resume.rafael.camacho.latest.pdf
        run: |
          set -euo pipefail

          test -s resume.pdf
          mv resume.pdf "$PDF_ASSET"
          expected_size=$(stat -c '%s' "$PDF_ASSET")
          pdf_sha256=$(sha256sum "$PDF_ASSET" | cut -d' ' -f1)

          # This build must still be main HEAD at publication time.
          current_head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale build $GITHUB_SHA; main is now $current_head."
            exit 0
          fi

          git fetch --tags --force origin

          # Numeric tags and release drafts both count toward version selection.
          highest=0
          existing_tag=""
          tag_names=$(git tag --list 'v[0-9]*')
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v([0-9]+)$ ]]; then
              number=$((10#${BASH_REMATCH[1]}))
              if (( number > highest )); then highest=$number; fi
            fi
          done <<< "$tag_names"

          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.tag_name, (.target_commitish // "")] | @tsv')
          while IFS=$'\t' read -r candidate target; do
            if [[ "$candidate" =~ ^v([0-9]+)$ ]]; then
              number=$((10#${BASH_REMATCH[1]}))
              if (( number > highest )); then highest=$number; fi
              if [[ "$target" == "$GITHUB_SHA" ]]; then
                if [[ -n "$existing_tag" && "$existing_tag" != "$candidate" ]]; then
                  echo "::error::Multiple releases reference the same commit."
                  exit 1
                fi
                existing_tag="$candidate"
              fi
            fi
          done <<< "$releases"

          if [[ -n "$existing_tag" ]]; then
            tag="$existing_tag"
            is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" == "false" ]]; then
              echo "Release $tag already published for commit $GITHUB_SHA."
              exit 0
            fi
            echo "Resuming draft $tag."
          else
            tag="v$((highest + 1))"
            notes=$(printf 'Source commit: %s\nPDF SHA-256: %s\n' "$GITHUB_SHA" "$pdf_sha256")
            gh release create "$tag" "$PDF_ASSET" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "$notes" \
              --draft
          fi

          # Retry partial drafts without clobbering assets that already exist.
          uploaded_size=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --jq '.assets[] | select(.name == "resume.rafael.camacho.latest.pdf") | .size')
          if [[ -z "$uploaded_size" ]]; then
            gh release upload "$tag" "$PDF_ASSET"
            uploaded_size=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq '.assets[] | select(.name == "resume.rafael.camacho.latest.pdf") | .size')
          fi
          if [[ "$uploaded_size" != "$expected_size" ]]; then
            echo "::error::Release $tag asset size mismatch."
            exit 1
          fi

          # No stale draft may become a public release.
          current_head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "Leaving $tag as draft; main moved to $current_head."
            exit 0
          fi

          gh release edit "$tag" --draft=false --latest
          echo "Published $tag from commit $GITHUB_SHA (SHA-256 $pdf_sha256)."
